<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted

        RewriteEngine On
        # Never rewrite real API requests — let PHP handle those normally.
        RewriteCond %{REQUEST_URI} !^/api/
        # Only rewrite requests that aren't an existing real file or folder
        # (so JS/CSS/image assets still load normally).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
</VirtualHost>
